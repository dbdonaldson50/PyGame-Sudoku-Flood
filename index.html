<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sudoku Game</h1>
        
        <div class="game-info">
            <div class="info-item">
                <span class="label">Lives:</span>
                <span id="lives" class="value">3</span>
            </div>
            <div class="info-item">
                <span class="label">Score:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">Time:</span>
                <span id="timer" class="value">00:00</span>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div id="sudoku-board" class="sudoku-board"></div>

        <div class="number-selector">
            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
            <button class="number-btn" data-number="3">3</button>
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
            <button class="number-btn" data-number="6">6</button>
            <button class="number-btn" data-number="7">7</button>
            <button class="number-btn" data-number="8">8</button>
            <button class="number-btn" data-number="9">9</button>
            <button class="number-btn erase-btn" data-number="0">✖</button>
        </div>

        <div class="controls">
            <button id="new-game-btn" class="control-btn">New Game</button>
            <button id="hint-btn" class="control-btn">Hint (-10 pts)</button>
            <button id="check-btn" class="control-btn">Check Solution</button>
        </div>

        <div class="difficulty-selector">
            <label>Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy (3 lives)</option>
                <option value="medium" selected>Medium (3 lives)</option>
                <option value="hard">Hard (5 lives)</option>
            </select>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
