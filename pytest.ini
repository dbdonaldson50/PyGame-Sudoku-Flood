[pytest]
# Pytest configuration for Sudoku Game
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Add custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

# Output options
addopts = 
    -ra
    --strict-markers
    --tb=short

# Coverage options (when using --cov)
[coverage:run]
source = .
omit = 
    test_*.py
    conftest.py
    .venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
